stages:
  preprocess:
    cmd: python -m src.data
    deps:
      - data/raw/creditcard.csv
      - src/data.py
    params:
      - params.yaml:
          - random_state
          - test_size
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/reference.csv
  train:
    cmd: python -m src.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train.py
    params:
      - params.yaml:
          - random_state
          - sampling_strategy
          - n_estimators
          - max_depth
          - min_samples_leaf
          - threshold
    outs:
      - artifacts/model.joblib
    metrics:
      - reports/metrics.json:
          cache: false
